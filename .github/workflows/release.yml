name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag matches package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "v$(jq -r .version package.json)" = "$TAG"

  build:
    name: ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: sbm-macos-arm64
            kind: macos
          - os: macos-15
            asset: sbm-windows-x64.exe
            kind: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install zig
        if: matrix.kind == 'windows'
        uses: ./.github/actions/setup-zig

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: matrix.kind == 'macos'
        run: bun run typecheck

      - name: Source tests
        if: matrix.kind == 'macos'
        run: bun run test:source

      - name: Build (macOS)
        if: matrix.kind == 'macos'
        run: bun run build

      - name: Build (Windows cross)
        if: matrix.kind == 'windows'
        run: |
          set -euo pipefail
          mkdir -p .runtime
          npm pack --silent @scriptc/runtime-win32-x64-msvc@0.4.7 --pack-destination .runtime > /dev/null
          mkdir -p .runtime/win32
          tar -xzf .runtime/scriptc-runtime-win32-x64-msvc-0.4.7.tgz -C .runtime/win32 --strip-components=1
          SCRIPTC_TARGET=x86_64-windows-gnu SCRIPTC_RUNTIME_PACK="$PWD/.runtime/win32" \
            bun scripts/build.mjs src/cli.ts dist/sbm.exe
          file dist/sbm.exe | grep -q 'PE32+'

      - name: Sign and verify (macOS)
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          test "v$(./dist/sbm --version)" = "$TAG"
          file dist/sbm | grep -q arm64
          codesign --force --sign - dist/sbm
          codesign --verify --verbose=2 dist/sbm

      - name: Verify (Windows cross)
        if: matrix.kind == 'windows'
        run: |
          set -euo pipefail
          file dist/sbm.exe | grep -q 'PE32+'

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ matrix.kind }}" = "windows" ]; then
            cp dist/sbm.exe "release/${{ matrix.asset }}"
          else
            cp dist/sbm "release/${{ matrix.asset }}"
            chmod +x "release/${{ matrix.asset }}"
          fi
          ls -lh release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum sbm-macos-arm64 sbm-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        working-directory: release
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes 2>/dev/null || true
          create=(--title "sbm $TAG" --verify-tag --generate-notes)
          case "$TAG" in *-*) create+=(--prerelease) ;; esac
          gh release create "$TAG" "${create[@]}" sbm-macos-arm64 sbm-windows-x64.exe SHA256SUMS
