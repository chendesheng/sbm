name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag matches package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "v$(jq -r .version package.json)" = "$TAG"

  build:
    name: ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: sbm-macos-arm64
          - os: windows-latest
            asset: sbm-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install zig
        if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: runner.os == 'macOS'
        run: bun run typecheck

      - name: Source tests
        if: runner.os == 'macOS'
        run: bun run test:source

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bun run build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: bun scripts/build.mjs src/cli.ts dist/sbm.exe

      - name: Sign and verify (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test "v$(./dist/sbm --version)" = "$TAG"
          file dist/sbm
          file dist/sbm | grep -q arm64
          codesign --force --sign - dist/sbm
          codesign --verify --verbose=2 dist/sbm

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (.\dist\sbm.exe --version | Out-String).Trim()
          if ("v$version" -ne $env:TAG) { throw "Binary version v$version does not match $env:TAG" }

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/sbm.exe "release/${{ matrix.asset }}"
          else
            cp dist/sbm "release/${{ matrix.asset }}"
            chmod +x "release/${{ matrix.asset }}"
          fi
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum sbm-macos-arm64 sbm-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: sbm ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/sbm-macos-arm64
            release/sbm-windows-x64.exe
            release/SHA256SUMS
