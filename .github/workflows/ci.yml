name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install zig
        uses: ./.github/actions/setup-zig

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Source tests
        run: bun run test:source

      - name: Build CLI
        run: bun run build

      - name: Verify CLI
        run: |
          ./dist/sbm --version
          ./dist/sbm --help > /dev/null
          codesign --verify --verbose=2 dist/sbm

      - name: Build menu bar app
        run: bun run build:app

      - name: Build Windows CLI (cross)
        run: |
          set -euo pipefail
          mkdir -p .runtime
          npm pack --silent @scriptc/runtime-win32-x64-msvc@0.4.7 --pack-destination .runtime > /dev/null
          mkdir -p .runtime/win32
          tar -xzf .runtime/scriptc-runtime-win32-x64-msvc-0.4.7.tgz -C .runtime/win32 --strip-components=1
          SCRIPTC_TARGET=x86_64-windows-gnu SCRIPTC_RUNTIME_PACK="$PWD/.runtime/win32" \
            bun scripts/build.mjs src/cli.ts dist/sbm.exe
          file dist/sbm.exe | grep -q 'PE32+'

      - uses: actions/upload-artifact@v7
        with:
          name: sbm-windows-ci
          path: dist/sbm.exe
          if-no-files-found: error
          retention-days: 1

      - name: E2E install and start (macOS)
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/sbm-smoke.json"
          cat > "$config" <<'JSON'
          {
            "log": { "level": "warn" },
            "inbounds": [{ "type": "mixed", "tag": "smoke", "listen": "127.0.0.1", "listen_port": 18080 }],
            "outbounds": [{ "type": "direct", "tag": "direct" }],
            "route": { "final": "direct" }
          }
          JSON
          ./dist/sbm install --version 1.14.4
          ./dist/sbm start --config "$config"
          ./dist/sbm status | tee "$RUNNER_TEMP/sbm-status.txt"
          grep -q 'State: running' "$RUNNER_TEMP/sbm-status.txt"

      - name: Clean up macOS service
        if: always()
        run: |
          sudo launchctl bootout system/io.github.chendesheng.sbm.sing-box 2>/dev/null || true
          sudo rm -f /Library/LaunchDaemons/io.github.chendesheng.sbm.sing-box.plist
          sudo pkill -f "Library/Application Support/sbm/bin/sing-box" 2>/dev/null || true
          sudo rm -rf "/Library/Application Support/sbm"
          rm -rf "$HOME/Library/Application Support/sbm" "$HOME/Library/Caches/sbm"

  e2e-windows:
    name: Windows E2E
    needs: macos-arm64
    if: ${{ always() && needs.macos-arm64.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbm-windows-ci
          path: dist

      - name: E2E install and start (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sbm = Join-Path $PWD 'dist\sbm.exe'
          if (-not (Test-Path $sbm)) { throw "Missing $sbm" }
          $config = Join-Path $env:RUNNER_TEMP 'sbm-smoke.json'
          @{
            log = @{ level = 'warn' }
            inbounds = @(@{ type = 'mixed'; tag = 'smoke'; listen = '127.0.0.1'; listen_port = 18080 })
            outbounds = @(@{ type = 'direct'; tag = 'direct' })
            route = @{ final = 'direct' }
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $config
          try {
            & $sbm install --version 1.14.4
            if ($LASTEXITCODE -ne 0) { throw "sbm install failed ($LASTEXITCODE)" }
            & $sbm start --config $config
            if ($LASTEXITCODE -ne 0) { throw "sbm start failed ($LASTEXITCODE)" }
            $status = & $sbm status
            if ($LASTEXITCODE -ne 0) { throw "sbm status failed ($LASTEXITCODE)" }
            $status | Write-Host
            if (-not ($status -match 'State: running')) { throw 'Unexpected sbm status' }
          } finally {
            $run = Join-Path $env:LOCALAPPDATA 'sbm\run.json'
            if (Test-Path $run) {
              $corePid = (Get-Content $run -Raw | ConvertFrom-Json).pid
              & taskkill /PID $corePid /T /F 2>$null
            }
            Remove-Item (Join-Path $env:LOCALAPPDATA 'sbm') -Recurse -Force -ErrorAction SilentlyContinue
          }

  windows-x64-tests:
    name: Windows x64 tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Windows platform tests
        run: bun test test/platform.test.ts
