name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Source tests
        run: bun run test:source

      - name: Build CLI
        run: bun run build

      - name: Verify CLI
        run: |
          ./dist/sbm --version
          ./dist/sbm --help > /dev/null
          codesign --verify --verbose=2 dist/sbm

      - name: Build menu bar app
        run: bun run build:app

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Windows platform tests
        run: bun test test/platform.test.ts

      - name: Build CLI
        run: bun scripts/build.mjs src/cli.ts dist/sbm.exe

      - name: Verify CLI
        run: |
          .\dist\sbm.exe --version
          .\dist\sbm.exe --help
