name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Source tests
        run: bun run test:source

      - name: Build CLI
        run: bun run build

      - name: Verify CLI
        run: |
          ./dist/sbm --version
          ./dist/sbm --help > /dev/null
          codesign --verify --verbose=2 dist/sbm

      - name: Build menu bar app
        run: bun run build:app

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Windows platform tests
        run: bun test test/platform.test.ts

      - name: Build CLI
        run: bun scripts/build.mjs src/cli.ts dist/sbm.exe

      - name: Diagnose build failure
        if: failure()
        run: |
          Get-ChildItem node_modules/scriptc/bin | Format-Table Name,Length
          Get-ChildItem node_modules/@scriptc | Select-Object Name
          $compiler = Get-Item node_modules/scriptc/bin/scriptc.exe
          Write-Host "compiler size: $($compiler.Length)"
          if ($compiler.Length -lt 1MB) { Get-Content $compiler.FullName }
          & $compiler.FullName --version
          Write-Host "compiler exit: $LASTEXITCODE"
          Write-Host "zig: $(zig version)"
          Get-Content node_modules/scriptc/bin/scriptc.exe.json
          [IO.File]::WriteAllText("$PWD\hello.ts", "console.log('hello')`n")
          & $compiler.FullName build hello.ts -o hello.exe 2>&1 | Write-Host
          Write-Host "hello exe exit: $LASTEXITCODE"
          & $compiler.FullName build hello.ts --emit=ir -o hello.ll 2>&1 | Write-Host
          Write-Host "hello ir exit: $LASTEXITCODE"
          & $compiler.FullName build hello.ts --emit=obj -o hello.obj 2>&1 | Write-Host
          Write-Host "hello obj exit: $LASTEXITCODE"
          & $compiler.FullName coverage hello.ts 2>&1 | Write-Host
          Write-Host "coverage exit: $LASTEXITCODE"
          & $compiler.FullName build src/cli.ts -o dist/cli-plain.exe
          Write-Host "cli plain exit: $LASTEXITCODE"
          if (Test-Path dist/cli-plain.exe) { Get-Item dist/cli-plain.exe | Format-List Name,Length }

      - name: Verify CLI
        run: |
          .\dist\sbm.exe --version
          .\dist\sbm.exe --help
