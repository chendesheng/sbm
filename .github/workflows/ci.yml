name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install zig
        uses: ./.github/actions/setup-zig

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Source tests
        run: bun run test:source

      - name: Build CLI
        run: bun run build

      - name: Verify CLI
        run: |
          ./dist/sbm --version
          ./dist/sbm --help > /dev/null
          codesign --verify --verbose=2 dist/sbm

      - name: Build menu bar app
        run: bun run build:app

      - name: Build Windows CLI (cross)
        run: |
          set -euo pipefail
          mkdir -p .runtime
          npm pack --silent @scriptc/runtime-win32-x64-msvc@0.4.7 --pack-destination .runtime > /dev/null
          mkdir -p .runtime/win32
          tar -xzf .runtime/scriptc-runtime-win32-x64-msvc-0.4.7.tgz -C .runtime/win32 --strip-components=1
          SCRIPTC_TARGET=x86_64-windows-gnu SCRIPTC_RUNTIME_PACK="$PWD/.runtime/win32" \
            bun scripts/build.mjs src/cli.ts dist/sbm.exe
          file dist/sbm.exe | grep -q 'PE32+'

  windows-x64-tests:
    name: Windows x64 tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Windows platform tests
        run: bun test test/platform.test.ts
